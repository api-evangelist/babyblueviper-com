  remediation: Register (POST /register) and send Authorization Bearer <api_key>; or pay the bolt11 invoice and retry with Authorization L402 <payment_hash>:<preimage>; or settle the x402 challenge and retry with X-PAYMENT. Do not treat as a transient failure.
