description: >-
  The contract declares only two non-2xx responses — 422 Validation Error on 103 operations (FastAPI's
  HTTPValidationError, a `detail` array of {loc, msg, type}) and 402 Payment Required on the 20 x402-priced
  operations — and no application/problem+json anywhere, so RFC 9457 does not apply. Live probes showed the
  real error envelope is FastAPI's {"detail": <string | object | array>}: 402 carries a rich object with the
  amount, a recommended registration path and an L402 invoice; 401 and 404 carry a string. The 402 is the
  important one for an agent: it is not an error to retry blindly but a payment challenge with two machine
  paths (L402 header or x402 X-PAYMENT).
envelope:
