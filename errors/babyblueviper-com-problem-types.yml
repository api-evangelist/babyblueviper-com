  operations: 20 (every operation carrying x-payment-info — reason, decision, review, review/external, agent-economy-brief, audit/agent-readiness, x402/seller-intel, regime, signals/full, markets/act, residence/act, web-act, browse, execute, prove, witness, validate, memory/store, memory/get, messages/post)
