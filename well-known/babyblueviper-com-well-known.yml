    invinoveritas runs everything on api.babyblueviper.com, which is also the MCP resource host
    (https://api.babyblueviper.com/mcp) and the A2A host. That host serves RFC 8414 authorization-server
    metadata (issuer https://api.babyblueviper.com, PKCE S256, a registration_endpoint for dynamic client
    registration, scopes_supported [mcp]), RFC 9728 protected-resource metadata whose resource is the MCP
    endpoint and whose authorization_servers points back at the same issuer, an ai-plugin.json manifest, an
    MCP server card at both /.well-known/mcp.json and /.well-known/mcp/server-card.json (byte-identical),
    the A2A agent card at both agent-card paths (captured in a2a/), a custom /.well-known/agent-handshake
    capability offer, and a security.txt. The security.txt is served as a JSON object (contact, policy,
    acknowledgments, canonical, expires 2027-04-08) with content-type application/json rather than the
    RFC 9116 text field format — the fields are there, the serialization is not the standard one, and its
    policy link points at the payment guide (/guide), not a disclosure policy. openid-configuration answers
    404 with a JSON body that explicitly says OpenID Connect is not implemented and points at the OAuth
    metadata. No RFC 9727 api-catalog, no APIs.json, no UCP/ACP manifest, no AAuth resource document. A
    negative-control path that cannot exist returns the host's real 22-byte JSON 404, so the 200s are
    served documents and not a catch-all. The registrable domain 301s every path to www.babyblueviper.com,
    a Substack publication; Substack's platform serves its own OAuth authorization-server metadata (issuer
    https://substack.com) on every publication's custom domain, recorded below for completeness and marked
    as platform-served — it is not invinoveritas' document and awards nothing here that the provider's own
    api-host document does not already earn.
