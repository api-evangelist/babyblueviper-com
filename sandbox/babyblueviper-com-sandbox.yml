description: >-
  invinoveritas has no separate sandbox environment, no test-mode keys and no test/live key prefix split —
  there is one host, one key type (ivv_) and real sats. What it publishes instead is a set of no-cost ways to
  exercise the real API: free endpoints, a free-call allowance on a new key, a dry-run flag on /review, a
  ready-to-verify sample proof, and a demo endpoint. Every value below is the provider's own, reproduced
  verbatim; nothing is invented.
test_vs_live:
  separation: none — single production host https://api.babyblueviper.com
  key_prefixes: {live: ivv_, test: none}
  note: Card- and x402-funded sats are spendable but not withdrawable (an abuse guard, not a test mode).
free_allowance:
  statement: >-
    "first 5 calls FREE, no funding needed" (live 402 body, 2026-09-19); llms.txt quick start shows a /review
    response with billing.free_call_used true and free_calls_remaining 2
  how: POST https://api.babyblueviper.com/register {"label":"my-agent"} then Authorization Bearer <api_key>
free_endpoints:
- POST /verify-proof (no auth) — verify any signed proof
- GET /ledger, /ledger/{entry}, /ledger.txt — the public verdict track record
- GET /conformance, /conformance.json — the conformance registry
- GET /signals — free BTC-regime teaser (paid multi-coin set at /signals/full)
- GET /agent-economy-brief/preview, /audit/agent-readiness/preview, /x402/seller-intel/preview — free previews of paid tools
- GET /health, /prices, /stats, /offers/list, /messages/feed
- MCP: initialize and tools/list are anonymous; memory_list, memory_search, memory_delete, feedback_*, residence_me, ledger, verify_proof are free tools
dry_run:
  operation: review_review_post
  field: dry_run (boolean)
  behaviour: computes and returns artifact_hash + decision_ref WITHOUT signing anything — no Nostr event, no schnorr signature, nothing committed (schema description)
  worked_example: https://github.com/babyblueviper1/invinoveritas/tree/main/examples/air-v03-verdict-dry-run
