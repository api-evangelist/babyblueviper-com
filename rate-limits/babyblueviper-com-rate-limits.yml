description: >-
  invinoveritas publishes no request-rate limits. GET /health advertises features.rate_limiting: true and the
  /execute pricing text says jobs have "rate limits", but no number, window, scope or 429 semantics appear
  anywhere — llms.txt, the guide, the OpenAPI, the MCP tool descriptions or the roadmap (which mentions only
  internal "1/UTC-day" throttles on operator agents). What IS published is resource ceilings per execution
  tier (timeout, RAM, vCPU, browser actions) and per-call prices, which bound spend rather than request rate.
  The only runtime header seen was Retry-After: 15 on every 402 payment challenge — a re-present-after-paying
  hint, not a throttle signal. A 15-request burst on /health returned 15 x 200 with no rate-limit headers.
  Recorded as an honest zero from live responses.
