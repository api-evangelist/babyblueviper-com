components:
  schemas:
    BrowseRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          title: Url
          description: Public http(s) URL to fetch in the isolated action layer.
        action:
          type: string
          enum:
          - fetch
          - extract_text
          - screenshot
          - multi_step
          title: Action
          description: fetch/extract_text use v0; screenshot uses Playwright BaaS v1; multi_step runs a sequence of click/type/navigate/wait/screenshot steps within the initial URL's domain.
          default: fetch
        selector:
          type: string
          maxLength: 200
          title: Selector
          description: Reserved for single-step Playwright actions.
          default: ''
        steps:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 5
          title: Steps
          description: 'Step sequence for multi_step action (max 5). Each step: {"action": "click|type|navigate|wait|screenshot", "selector": "css", "value": "text", "url": "https://..."}.'
        max_bytes:
          type: integer
          maximum: 262144.0
          minimum: 1024.0
          title: Max Bytes
          default: 65536
        viewport_width:
          type: integer
          maximum: 1920.0
          minimum: 320.0
          title: Viewport Width
          default: 1280
        viewport_height:
          type: integer
          maximum: 1600.0
          minimum: 320.0
          title: Viewport Height
          default: 900
        wait_ms:
          type: integer
          maximum: 3000.0
          minimum: 0.0
          title: Wait Ms
          default: 500
        tier:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Tier
          description: 'Execution tier: 0 starter, 1 default, 2 premium, 3 enterprise.'
          default: 1
        agent_id:
          type: string
          maxLength: 120
          title: Agent Id
          default: ''
      type: object
      required:
      - url
      title: BrowseRequest
    BuyOfferRequest:
      properties:
        offer_id:
          type: string
          minLength: 1
          title: Offer Id
        verify_before_buy:
          type: boolean
          title: Verify Before Buy
          description: Run a neutral /review verdict on this offer BEFORE charging; a reject blocks the purchase (no sats spent).
          default: false
        intent:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent
          description: What you intend to use this offer for — context for the verification gate (optional).
        buyer_input:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Buyer Input
          description: Optional buyer-supplied data the seller needs to fulfil this specific purchase (e.g. a Lightning node pubkey for a node-analysis report). Passed through opaquely — never validated or interpreted by the platform — and surfaced to the seller via GET /offers/my/purchases. Do not put credentials, private keys, or seed phrases here.
      type: object
      required:
      - offer_id
      title: BuyOfferRequest
    CheckoutBody:
      properties:
        plan:
          type: string
          title: Plan
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        client_reference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Reference Id
        seats:
          type: integer
          title: Seats
          default: 1
      type: object
      required:
      - plan
      title: CheckoutBody
    ConfirmRequest:
      properties:
        payment_hash:
          type: string
          title: Payment Hash
        preimage:
          type: string
          title: Preimage
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      type: object
      required:
      - payment_hash
      - preimage
      title: ConfirmRequest
    ConsolidationPlanRequest:
      properties:
        addresses:
          items:
            type: string
          type: array
          title: Addresses
          description: 1-10 mainnet Bitcoin addresses to scan (bc1q/bc1p/1/3).
        dest_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Dest Address
          description: Destination for consolidated funds (bc1q.../bc1p... only). Defaults to the single source address if only one is given.
        fee_rate:
          type: integer
          maximum: 300.0
          minimum: 1.0
          title: Fee Rate
          description: sat/vB.
          default: 15
        execution_template:
          type: string
          title: Execution Template
          description: 'How aggressively to consolidate: low, moderate, high, or extreme.'
          default: moderate
        dust_threshold:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Dust Threshold
          description: Ignore UTXOs at or below this many sats.
          default: 546
        confirm_privacy_cluster_merge:
          type: boolean
          title: Confirm Privacy Cluster Merge
          description: Required (set true) when more than one source address is given. Consolidating UTXOs from multiple addresses into one transaction links them on-chain via the common-input-ownership heuristic -- irreversible, unlike an unfavorable fee. A single address never needs this.
          default: false
      type: object
      required:
      - addresses
      title: ConsolidationPlanRequest
    CreateOfferRequest:
      properties:
        seller_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Seller Id
        ln_address:
          type: string
          title: Ln Address
          description: Lightning address (user@domain.com) to receive 95% payouts
        title:
          type: string
          maxLength: 120
          minLength: 3
          title: Title
        description:
          type: string
          maxLength: 2000
          minLength: 10
          title: Description
        price_sats:
          type: integer
          title: Price Sats
          description: Price in sats (buyer pays this)
        category:
          type: string
          maxLength: 50
          title: Category
          default: agent
        content_file:
          anyOf:
          - type: string
          - type: 'null'
          title: Content File
          description: Filename in /content/ to deliver on purchase (Waternova)
        preview_text:
          anyOf:
          - type: string
            maxLength: 280
          - type: 'null'
          title: Preview Text
          description: Short teaser displayed on marketplace cards
        thumbnail_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Thumbnail Url
          description: Optional HTTPS thumbnail/preview image URL
        eligibility_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Eligibility Url
          description: Optional HTTPS server-to-server endpoint we call BEFORE charging the buyer or paying you, to confirm this specific purchase is sellable (e.g. real-time inventory tied to buyer_input). Only an ACCEPT response authorizes the charge; REJECT, a timeout, or any non-2xx/invalid response refuses the purchase with nothing charged. See docs for the exact request/response contract.
        eligibility_bearer:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Eligibility Bearer
          description: Bearer credential we send as Authorization on the eligibility_url call. Stored server-side only -- never returned by any endpoint, including your own /offers/my.
      type: object
      required:
      - seller_id
      - ln_address
      - title
      - description
      - price_sats
      title: CreateOfferRequest
    DecisionRequest:
      properties:
        goal:
          type: string
          title: Goal
          description: The overall goal or objective
        context:
          type: string
          title: Context
          description: Background context (market conditions, positions, risk tolerance, etc.)
          default: ''
        question:
          type: string
          title: Question
          description: The specific decision question
        style:
          type: string
          enum:
          - short
          - concise
          - normal
          - detailed
          title: Style
          description: 'Response style: short, concise, normal, or detailed'
          default: normal
        want_confidence:
          type: boolean
          title: Want Confidence
          description: Include confidence score, risk level, and uncertainty factors (recommended for decisions)
          default: true
        response_format:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Format
          description: Optional JSON schema for structured output
      type: object
      required:
      - goal
      - question
      title: DecisionRequest
    DirectoryOptInRequest:
      properties:
        listed:
          type: boolean
          title: Listed
          description: true to appear in the resident directory; false to opt out
          default: true
      type: object
      title: DirectoryOptInRequest
    ExecuteRequest:
      properties:
        language:
          type: string
          const: python
          title: Language
          default: python
        code:
          type: string
          maxLength: 6000
          minLength: 1
          title: Code
        stdin:
          type: string
          maxLength: 20000
          title: Stdin
          default: ''
        timeout_seconds:
          anyOf:
          - type: number
            maximum: 600.0
            minimum: 0.5
          - type: 'null'
          title: Timeout Seconds
        tier:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Tier
          description: 'Execution tier: 0 starter, 1 default, 2 premium, 3 enterprise.'
          default: 1
        agent_id:
          type: string
          maxLength: 120
          title: Agent Id
          default: ''
        permissive:
          type: boolean
          title: Permissive
          description: 'Permissive mode: run ARBITRARY Python — any import, full builtins, no AST allowlist — relying on the hardened isolated container (network OFF, read-only root, all caps dropped, non-root, resource-capped) as the boundary. Priced at a premium. Default False keeps the restrictive allowlist sandbox.'
          default: false
        use_workspace:
          type: boolean
          title: Use Workspace
          description: Mount a persistent per-agent workspace at /workspace (read-write for the agent). Files, installed packages, and git clones survive across calls. Storage is lightly metered. Only available in higher tiers or with permissive=True.
          default: false
      type: object
      required:
      - code
      title: ExecuteRequest
    FeedbackRequest:
      properties:
        category:
          type: string
          title: Category
          description: suggestion | complaint | issue | feature
        title:
          type: string
          maxLength: 140
          minLength: 3
          title: Title
        body:
          type: string
          maxLength: 4000
          title: Body
          default: ''
      type: object
      required:
      - category
      - title
      title: FeedbackRequest
    FulfillPurchaseRequest:
      properties:
        fulfillment_ref:
          type: string
          maxLength: 500
          minLength: 1
          title: Fulfillment Ref
          description: A buyer-visible report reference or expiring delivery URL for this purchase.
      type: object
      required:
      - fulfillment_ref
      title: FulfillPurchaseRequest
    GrantFirstCallRequest:
      properties:
        token:
          type: string
          maxLength: 2048
          minLength: 20
          title: Token
        target_api_key:
          type: string
          minLength: 10
          title: Target Api Key
      type: object
      required:
      - token
      - target_api_key
      title: GrantFirstCallRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HousePolicy:
      properties:
        max_spend_sats:
