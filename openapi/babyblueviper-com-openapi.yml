    VerifyProofRequest:
      properties:
        event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Event
          description: The signed proof event {id,pubkey,created_at,kind,tags,content,sig} from a /prove or /review(sign=true) response. Trustless path — no lookup, no trust.
        proof_event:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Proof Event
          description: 'Alias for `event`, accepting the exact key name GET /ledger/{N} itself uses for the same object (`proof_event`) — added 2026-08-17 after a real caller (大賀俊勝/Toshikatsu, independent verification walk) hit this: Pydantic silently drops an unrecognized field rather than erroring, so posting a /ledger response''s `proof_event` value under that same key previously no-op''d into the ''provide `event`'' error with no hint the key name itself was the problem. If both `event` and `proof_event` are provided, `event` takes precedence.'
        proof_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Proof Id
          description: Alternatively, a stored attestation proof_id to fetch + verify (convenience).
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
          description: Alternatively, the Nostr event id from a /review(sign=true), /prove, or /witness proof — fetches the durably-stored full event (independent of relay retention) and verifies it. Use this when you only have {id,pubkey,sig}, not the full event, from wherever the proof was shared.
        pq_companion_signature:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pq Companion Signature
          description: 'Optional (added 2026-08-12): the ML-DSA-65 companion signature {algorithm,pq_pubkey,signature_hex,signs} from a proof issued alongside `event`, if you have one — additively verified and reported as checks.pq_companion_verified, never required. Only used with the `event` path; event_id/proof_id lookups fetch their own stored companion sig automatically if one exists.'
        expect_artifact_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Expect Artifact Hash
          description: 'Optional: assert the proof covers THIS artifact (sha256 hex of the output you were handed).'
        expect_intended_verifier:
          anyOf:
          - type: string
          - type: 'null'
          title: Expect Intended Verifier
          description: 'Optional (added 2026-08-16, per safal207''s content/generation/consumption-identity framing on crewAIInc/crewAI#4877): assert the proof''s declared intended_verifier matches who YOU are, closing the same gap expect_artifact_hash closes for content_identity -- but for consumption_identity. Checks a self-declared field (see /review''s own intended_verifier docstring: ''we cannot confirm who will actually present this proof downstream''), so a match confirms the ISSUER''s declared intent, not that delivery was actually restricted to you.'
        verifier_signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Verifier Signature
          description: 'Optional (added 2026-08-16, per atomicdjt''s presenter-bound critique on the same thread): an EIP-191 personal_sign signature over the fixed challenge ''invinoveritas-verify-proof:<event_id>'', signed by the private key controlling the address in expect_intended_verifier (eip155:* CAIP-10 namespace only). If provided and it recovers to that address, sets checks.intended_verifier_authenticated=true -- this is presenter-bound (you cryptographically proved you hold that key), not just intent-bound (a caller-supplied string anyone could claim). Requires expect_intended_verifier to also be set. Other CAIP-10 namespaces are not yet supported and are reported as such, not silently ignored.'
        expect_max_age_seconds:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Expect Max Age Seconds
          description: 'Optional (added 2026-08-17, per tyche-dev''s mandate-gate design on w3c-cg/ai-agent-protocol#44): by default `/verify-proof` never rejects on staleness -- `age_seconds` is purely informational, you decide. Pass this to turn it into an actual MUST-reject gate, symmetric to expect_artifact_hash/expect_intended_verifier: if the proof''s age_seconds exceeds this bound, checks.freshness_within_bound=false and valid flips to false. If age_seconds cannot be determined at all (an older proof with no verified_at), this fails CLOSED (freshness_within_bound=false, with a freshness_within_bound_error explaining why) rather than silently passing -- you asked to enforce freshness and we couldn''t confirm it, so it does not pass. Omit this param and nothing changes (informational-only, exactly today''s behavior).'
        consume:
          type: boolean
          title: Consume
          description: 'Optional (added 2026-09-07, per a nullifier-design comparison against crewAI#4877/ERC-8380): a verdict-issuance layer binding request+decision correctly is not automatically a replay-safe execution-consumption layer -- decision_ref is a pure function, so nothing stopped the identical, still-valid proof from being presented more than once. Pass true at the ACTUAL dispatch point (never earlier -- consuming before you''ve genuinely acted on it burns the verdict for nothing) to atomically claim single-use consumption of this proof''s decision_ref. Sets `checks.decision_ref_consumed` (true only on the first-ever presentation) and `checks.decision_ref_already_consumed` (true if some earlier call already consumed it -- a real replay), and flips `valid` to false on a replay. Absent by default: omit this and nothing changes, matching every other optional check here. Requires decision_ref_recomputes to have passed (a tampered proof cannot burn a real nullifier slot) and only
            applies to verdict proofs that carry a decision_ref at all (non-applicable otherwise, reported as such, never silently treated as consumed).'
          default: false
        expect_pq_binding:
          type: boolean
          title: Expect Pq Binding
          description: 'Optional (added 2026-09-01, Vértice/verticecriativo pq-wallet-binding — a non-custodial post-quantum key-binding anchor, PqBindingAnchor.sol, first-write-immutable). Requires `expect_intended_verifier` to also be an eip155 CAIP-10 address. When true, we independently verify — never trusting Vértice''s gateway blindly — that this address has a real, anchored post-quantum key binding: fetch the binding statement, recompute its content-address ourselves via RFC-8785 JCS + sha256, and independently eth_call `PqBindingAnchor.bindingOf(address)` on a public Sepolia RPC, requiring our own recompute to match BOTH the gateway''s claim AND the real on-chain value. Sets `checks.pq_binding_verified` (true/false/null, derived 1:1 from `checks.pq_binding_evidence`) and `checks.pq_binding_evidence` — a genuine three-way read: `"verified"`, `"refuted"` (a confirmed mismatch or a confirmed-absent on-chain binding — we actually completed the check and it came back negative), or `"unverifiable"`
            (the check could not be completed at all — network failure, malformed/unusable gateway data, or bad input; NEVER conflated with `"refuted"`, since that would misreport an incomplete check as a genuine finding) — plus a `pq_binding` disclosure block (statement, pq_pubkey, which values matched, which RPC answered, and a machine-readable `reason` code for any non-`"verified"` result). This is testnet-only as of this field (chain_id 11155111, disclosed in the response) and an IDENTITY provenance claim, not transaction-level quantum safety — a stronger provenance signal on top of `verifier_signature`''s ECDSA proof, not a replacement for it. `valid` flips to false only when evidence is `"refuted"`; `"unverifiable"` never flips `valid` on its own, since that would let an unrelated network hiccup or gateway data bug reject an otherwise-good proof.'
          default: false
      type: object
      title: VerifyProofRequest
      description: S169 — verify a counterparty's invinoveritas proof (the agent-to-agent trust handshake).
