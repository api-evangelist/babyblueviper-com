          description: 'Optional: third-party evidence this judgment relied on (e.g. a tool-reliability registry''s own PASS/FAIL record) — the composition pattern worked out with arian-gogani/nobulex-registry#1 (2026-09-10): OUR judgment is point-in-time action soundness, a registry''s is historical/empirical tool truthfulness, and the two compose as an input rather than one replacing the other. Each entry: {''source'': str, ''record'': str (the evidence issuer''s OWN exact saved bytes, verbatim — NOT a JSON object we reserialize; UTF-8 text), ''record_sha256'': str (sha256 of `record` computed by the ISSUER over their own stored bytes, so a mismatch here means either you or they transcribed it wrong), ''evidence_type'': str, ''observed_at'': str (ISO 8601), ''validity_until'': str | None (ISO 8601, if the issuer defines a validity window)}. DELIBERATE DESIGN CHOICE, not an oversight: `record` is bound as opaque raw text, never re-parsed and re-emitted as JSON on our side — RFC-8785 JCS canonicalization (used for `action_binding.args` above) exists to let two parties who might each reconstruct the SAME logical object differently agree on one byte sequence; a third-party record has no such ambiguity; it''s already one fixed byte sequence the issuer produced, so re-encoding it would only risk silently diverging from what they actually stored. All entries are hashed together (sha256 over the JCS-canonicalized array) into `external_evidence_hash`, bound into decision_ref — so ''our verdict explicitly accounted for this exact evidence, as of this exact byte sequence'' is independently checkable, not just claimed in prose. We do NOT verify record_sha256 against `record`, authenticate the issuer, freshness, or whether the record is genuine — this field states what evidence the CALLER supplied and commits it into the hash; verifying it is real is the caller''s own responsibility before relying on our verdict, same honest-limit shape as action_binding above.'
