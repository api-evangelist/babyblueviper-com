openapi: 3.2.0
info:
  title: Babyblueviper Com Discovery API
  version: 1.13.0
  contact:
    name: invinoveritas
    url: https://api.babyblueviper.com/
    email: contact@agents.babyblueviper.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-guidance: 'invinoveritas — the VERIFICATION LAYER for autonomous agents: a neutral verdict before an irreversible action, a signed proof after, and a public, on-chain-verifiable track record of those verdicts you can audit without trusting us — the oversight + judgment the agent can''t self-issue. Pay-per-call services settled in USDC via x402 on Base (also Lightning/L402 or a funded Bearer balance). Paid resources carry x-payment-info and answer an unauthenticated probe with a 402 challenge; send the JSON body in the operation schema, then retry with the X-PAYMENT header. Good entry points: POST /review (capital-scale-aware verdict before an agent ships an irreversible action), POST /prove (signed, independently-verifiable attestation of a prior execution), GET /ledger (the public signed verdict track record). Routes marked security:[] are free or Bearer/identity-gated and are not x402 resources.'
  description: 'Operations tagged discovery across 2 of this provider''s published API definitions: babyblueviper-com-openapi-original.json, babyblueviper-com-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Discovery
paths:
  /discovery/x402:
    get:
      tags:
      - Discovery
      summary: X402 Discovery Catalog
      description: 'Aggregated x402 service catalog — the single machine-readable list CDP Bazaar /

        x402scan crawl to enumerate every x402-payable resource we sell (accepts[] + bazaar

        discovery extension per item). The discoverability surface that makes our existing

        paid endpoints findable to Base agents from one URL.'
      operationId: x402_discovery_catalog_discovery_x402_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /memory:
    get:
      tags:
      - Discovery
      summary: Memory Info
      description: Public info about the memory service
      operationId: memory_info_memory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /.well-known/agent-handshake:
    get:
      tags:
      - Discovery
      summary: Agent Handshake
      description: 'Verification-handshake capability descriptor — the federation RECEIVER (S169).


        Any agent home (a corporation''s agent gateway, a database-backed agent, another platform''s

        fleet) can read this to establish a trust handshake with invinoveritas WITHOUT being contacted:

        learn our verifier identity, how to verify our proofs without trusting us, how to get proofs for

        its own output, and the two-way norm. The handshake is always DECLINABLE — reading this offers a

        capability, it obligates nothing. This is also the canonical payload we OFFER outbound to discovered

        agent homes (a structured, one-time, declinable capability offer — not unsolicited content).'
      operationId: agent_handshake__well_known_agent_handshake_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
x-refined-from:
- babyblueviper-com-openapi-original.json
- babyblueviper-com-openapi.yml
