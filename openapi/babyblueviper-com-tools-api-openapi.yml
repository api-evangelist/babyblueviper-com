openapi: 3.2.0
info:
  title: invinoveritas Tools API
  description: The **verification layer for autonomous agents** — a neutral verdict before an irreversible action (`/review`), a signed proof after (`/prove`), and a public, on-chain-verifiable track record (`/ledger`) you can audit without trusting us.
  contact:
    name: invinoveritas
    url: https://api.babyblueviper.com/
    email: contact@agents.babyblueviper.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.13.0
  x-guidance: 'invinoveritas — the VERIFICATION LAYER for autonomous agents: a neutral verdict before an irreversible action, a signed proof after, and a public, on-chain-verifiable track record of those verdicts you can audit without trusting us — the oversight + judgment the agent can''t self-issue. Pay-per-call services settled in USDC via x402 on Base (also Lightning/L402 or a funded Bearer balance). Paid resources carry x-payment-info and answer an unauthenticated probe with a 402 challenge; send the JSON body in the operation schema, then retry with the X-PAYMENT header. Good entry points: POST /review (capital-scale-aware verdict before an agent ships an irreversible action), POST /prove (signed, independently-verifiable attestation of a prior execution), GET /ledger (the public signed verdict track record). Routes marked security:[] are free or Bearer/identity-gated and are not x402 resources.'
tags:
- name: Tools
paths:
  /omega-pruner/plan:
    post:
      tags:
      - Tools
      summary: Omega Pruner Plan
      description: 'Free, no-auth. Scans the given address(es) for confirmed UTXOs, applies a

        deterministic consolidation selection, and returns an unsigned PSBT plus the

        exact inputs/economics behind it. Never touches a private key. Sign the

        returned PSBT with your own wallet -- this endpoint cannot and does not.'
      operationId: omega_pruner_plan_omega_pruner_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidationPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
components:
  schemas:
    ConsolidationPlanRequest:
      properties:
        addresses:
          items:
            type: string
          type: array
          title: Addresses
          description: 1-10 mainnet Bitcoin addresses to scan (bc1q/bc1p/1/3).
        dest_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Dest Address
          description: Destination for consolidated funds (bc1q.../bc1p... only). Defaults to the single source address if only one is given.
        fee_rate:
          type: integer
          maximum: 300.0
          minimum: 1.0
          title: Fee Rate
          description: sat/vB.
          default: 15
        execution_template:
          type: string
          title: Execution Template
          description: 'How aggressively to consolidate: low, moderate, high, or extreme.'
          default: moderate
        dust_threshold:
          type: integer
          maximum: 10000.0
          minimum: 0.0
          title: Dust Threshold
          description: Ignore UTXOs at or below this many sats.
          default: 546
        confirm_privacy_cluster_merge:
          type: boolean
          title: Confirm Privacy Cluster Merge
          description: Required (set true) when more than one source address is given. Consolidating UTXOs from multiple addresses into one transaction links them on-chain via the common-input-ownership heuristic -- irreversible, unlike an unfavorable fee. A single address never needs this.
          default: false
      type: object
      required:
      - addresses
      title: ConsolidationPlanRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
