openapi: 3.2.0
info:
  title: invinoveritas Meta API
  description: The **verification layer for autonomous agents** — a neutral verdict before an irreversible action (`/review`), a signed proof after (`/prove`), and a public, on-chain-verifiable track record (`/ledger`) you can audit without trusting us.
  contact:
    name: invinoveritas
    url: https://api.babyblueviper.com/
    email: contact@agents.babyblueviper.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.13.0
  x-guidance: 'invinoveritas — the VERIFICATION LAYER for autonomous agents: a neutral verdict before an irreversible action, a signed proof after, and a public, on-chain-verifiable track record of those verdicts you can audit without trusting us — the oversight + judgment the agent can''t self-issue. Pay-per-call services settled in USDC via x402 on Base (also Lightning/L402 or a funded Bearer balance). Paid resources carry x-payment-info and answer an unauthenticated probe with a 402 challenge; send the JSON body in the operation schema, then retry with the X-PAYMENT header. Good entry points: POST /review (capital-scale-aware verdict before an agent ships an irreversible action), POST /prove (signed, independently-verifiable attestation of a prior execution), GET /ledger (the public signed verdict track record). Routes marked security:[] are free or Bearer/identity-gated and are not x402 resources.'
tags:
- name: Meta
  description: Health, pricing, and discovery endpoints
paths:
  /verify:
    get:
      tags:
      - Meta
      summary: Verify Panel
      description: 'In-browser recompute panel for the PQ key binding (2026-07-30). Closes a real gap flagged

        the same day the binding shipped: /verify-proof and /.well-known/pq-key-binding.json are both

        JSON APIs -- every "verify this yourself" claim meant "curl this," not "click a link and watch

        it recompute in front of you." Two cards now (2026-07-30, same day): ours (ML-DSA-65, NIP-01

        carrier) and trustless-ai/KYA-L4''s (SLH-DSA-SHA2-192s, on-chain OCP-anchored, no carrier) --

        the full symmetric mirror of Merlini''s own panel (ai.verticecriativo.pt/quantum), which already

        verifies ours. Neither side trusts the other''s UI; both independently recompute from raw bytes,

        fetched live (CORS-enabled) from each origin. Uses vendored @noble/post-quantum@0.4.1 +

        @noble/hashes@1.8.0 (static/vendor/, see its README) served from our own origin, not a CDN --

        a "don''t trust, recompute" page shouldn''t itself require trusting a third party. Scope is the

        hash-recompute + PQ companion-signature verify + tamper check, same as the shared

        pq-key-binding-v0 conformance profile''s documented split; the classical signature (Schnorr for

        ours, the on-chain record() sender for KYA-L4) and the anchor-vs-chain read are the separate

        "deeper lane" (POST /verify-proof for ours; read the tx directly for theirs).'
      operationId: verify_panel_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
      security: []
