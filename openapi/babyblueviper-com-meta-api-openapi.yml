      summary: Pq Key History
      description: 'Append-only PQ companion-key rotation / revocation manifest. Same discipline as

        /.well-known/verifier-keys.json: a holder of any PQ-companion-signed proof can confirm

        the claimed pq_pubkey was active in the window containing the proof''s created_at.

        Seeded with the one ML-DSA-65 key published in pq-key-binding.json; on rotation the

        outgoing key is marked retired (not deleted) so in-window companions stay verifiable.'
      operationId: pq_key_history_governance_pq_key_history_get
      responses:
