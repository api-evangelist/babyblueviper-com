apis:
- name: invinoveritas MCP Server
  description: >-
    Remote MCP server (streamable HTTP, protocol 2025-06-18) at https://api.babyblueviper.com/mcp exposing
    31 tools with inputSchema, pricing and annotations: review, reason, decision, signals, markets_act,
    memory_*, execute, browse, prove, witness, validate, verify_proof, ledger, ledger_submit, conformance_certify,
    feedback_*, and residence_me. tools/list and initialize answer anonymously; paid tool calls need a
    Bearer key, an L402 payment, or x402. RFC 8414 and RFC 9728 metadata are served on the same host with
    dynamic client registration and PKCE.
  image: https://api.babyblueviper.com/logo.svg
  humanURL: https://api.babyblueviper.com/install
  baseURL: https://api.babyblueviper.com/mcp
