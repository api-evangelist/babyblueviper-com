- name: invinoveritas A2A Agent
  description: >-
    A2A agent "invinoveritas-reasoning-agent" (protocolVersion 0.3.0, JSONRPC transport) at https://api.babyblueviper.com/a2a
    with 15 skills mirroring the MCP tools. The agent card is served at both the canonical /.well-known/agent-card.json
    and the legacy /.well-known/agent.json path and grades conformant against A2A 1.0.0.
  image: https://api.babyblueviper.com/logo.svg
