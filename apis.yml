- name: invinoveritas API
  description: >-
    REST API on api.babyblueviper.com (FastAPI, OpenAPI 3.1.0, version 1.13.0, 174 paths / 187 operations):
    pre-action review verdicts, signed proofs, witnessing, the public verdict ledger and conformance registry,
    EdgeProof backtest validation, markets data feeds, reasoning and decision endpoints, sandboxed code execution,
    browser-as-a-service, wallet-keyed agent memory, an agent marketplace, a paid message board, account/credit
    and Stripe billing. Free registration returns a Bearer key; paid operations answer an unauthenticated call
    with HTTP 402 carrying an L402 invoice or an x402 payment-required challenge.
