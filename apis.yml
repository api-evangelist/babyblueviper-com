aid: babyblueviper-com
name: invinoveritas
description: >-
  invinoveritas, published by Baby Blue Viper, is a verification layer for autonomous agents: a neutral,
  model-agnostic verdict before an irreversible action (POST /review), a schnorr-signed portable proof after
  (POST /prove), and a public, Nostr- and Bitcoin-anchored track record (GET /ledger) that anyone can recompute
  against the published key. It is exposed as a REST API (OpenAPI 3.1, 187 operations on api.babyblueviper.com),
  a remote MCP server with 31 tools at /mcp (OAuth 2.1 metadata, anonymous tools/list), and an A2A agent with a
  conformant 0.3.0 agent card. Paid calls settle per call in Bitcoin Lightning sats (Bearer credits or L402), USDC
  via x402 on Base, or by card through Stripe governance subscriptions; /verify-proof and /ledger are free.
