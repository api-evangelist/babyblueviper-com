deployment:
  mode: remote
  endpoint: https://api.babyblueviper.com/mcp
  install: null
  package: null
  auth: oauth
  verified: probed
  note: 'Verified 2026-09-19 by POSTing JSON-RPC initialize and tools/list to the endpoint with Accept:
    application/json, text/event-stream. Both answered HTTP 200 text/event-stream with a real result:
    initialize returned protocolVersion 2025-06-18, serverInfo {name: invinoveritas, version: 1.13.0}
    and capabilities {tools: {listChanged: true}, resources, prompts}; tools/list returned 31 tools with
    inputSchema, per-tool pricing and MCP annotations (saved verbatim in babyblueviper-com-mcp-tools.json
    and babyblueviper-com-mcp-initialize.json). Discovery is anonymous; paid tool calls require credentials:
    Authorization: Bearer <api_key> (free key from POST /register; the provider''s own Cursor plugin mcp.json
    forwards ${IVV_API_KEY} that way), or L402 (Lightning), or x402 (USDC on Base). OAuth 2.1 metadata
    for the resource is published per RFC 8414/9728 on the same host (scopes_supported [mcp], PKCE S256,
    dynamic client registration at /oauth/register) — hence auth: oauth, with api-key as the documented
    everyday path. The old stdio package (npm invinoveritas-mcp 1.6.2, 2026-05-06) is DEPRECATED on the
    registry with the notice "Use the remote endpoint at https://api.babyblueviper.com/mcp directly",
    so mode is remote, not both. Smithery also lists the server (babyblueviper1/invinoveritas) with a
    Smithery-hosted proxy at https://invinoveritas.run.tools; that is a third-party relay of the same
    remote server, not a second provider deployment.'
server:
  name: invinoveritas
  transport: http
  protocol_version: '2025-06-18'
  url: https://api.babyblueviper.com/mcp
  version: 1.13.0
  registry_name: com.babyblueviper/invinoveritas
  server_card: https://api.babyblueviper.com/.well-known/mcp/server-card.json
  capabilities:
    tools:
      listChanged: true
    resources:
      listChanged: false
    prompts:
      listChanged: false
  auth:
    discovery: anonymous (initialize + tools/list answer without credentials)
    paid_calls:
    - Bearer api_key
    - L402 Lightning
    - x402 USDC
    oauth:
      authorization_server: https://api.babyblueviper.com/.well-known/oauth-authorization-server
      protected_resource: https://api.babyblueviper.com/.well-known/oauth-protected-resource
      scopes:
      - mcp
      dynamic_client_registration: true
      pkce:
      - S256
  client_configs:
    cursor_plugin: https://github.com/babyblueviper1/invinoveritas/blob/main/integrations/cursor-plugin/mcp.json
