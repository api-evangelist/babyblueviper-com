description: Binds every MCP tool the remote server advertises to the REST operation(s) that back it, so an agent
  can take the real parameter contract from the OpenAPI. The MCP tool names are the REST path segments with underscores,
  and 28 of 31 tools bind to a public operation with high confidence; the three workspace_* tools have no REST counterpart
  in the published contract. Many REST operations (account/credit, Stripe billing, warden internals, marketplace
  listings, messaging inbox, corpus, meta pages) have no tool — the MCP surface is the paid, agent-facing subset.
