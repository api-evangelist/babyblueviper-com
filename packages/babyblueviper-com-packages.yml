description: >-
  First-party client libraries, verifiers and framework connectors for invinoveritas. All npm packages are
  published by the single maintainer babyblueviper1 with author "invinoveritas" and repository
  github.com/babyblueviper1/invinoveritas (or a sibling repo of the same account), so official is true
  throughout. The core SDK is the PyPI package "invinoveritas" (InvinoClient); the verifier
  "invinoveritas-verify" ships on both npm and PyPI and is the zero-dependency offline proof checker (the PyPI
  build also installs the three CLIs catalogued in cli/). The remaining npm packages are framework adapters
  (n8n, Flowise, Activepieces, elizaOS, GOAT, Coinbase AgentKit, Virtuals ACP, OpenClaw, MetaMask Snap). The old
  stdio MCP package invinoveritas-mcp is deprecated on npm in favour of the remote endpoint and is listed for
  the record only.
